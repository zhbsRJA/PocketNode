# ─────────────────────────────────────────────────────────────
# Gradle 全局配置
# ─────────────────────────────────────────────────────────────

# Gradle 守护进程的内存上限
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 配置缓存：第二次构建能跳过配置阶段，快很多
org.gradle.configuration-cache=true

# Kotlin 代码风格
kotlin.code.style=official

# ─────────────────────────────────────────────────────────────
# JDK 工具链（针对国内网络的关键设置）
#
# Android Studio 2026 的新模板要求 Gradle 守护进程跑在 JDK 25 上，
# 写在 gradle/gradle-daemon-jvm.properties 里。本地没有 JDK 25 时，
# Gradle 会自动去 api.foojay.io 下载 —— 它会重定向到 GitHub Releases，
# 国内访问会超时，构建直接失败：
#
#   Unable to download toolchain ... Could not HEAD
#   'https://github.com/adoptium/temurin25-binaries/...'
#
# 解法：指向本地已有的 JDK 25 并关掉自动下载。
# Android Studio 自带的 JBR（JetBrains Runtime）就是完整 OpenJDK 25，
# 有 javac / jlink / jar，可以直接当构建工具链，零额外下载。
# ─────────────────────────────────────────────────────────────
org.gradle.java.installations.paths=D:/Android/Studio/jbr
org.gradle.java.installations.auto-download=false

# ─────────────────────────────────────────────────────────────
# 关掉 AGP 的 SDK 自动下载
#
# 默认情况下，AGP 发现缺 SDK 组件（platform / build-tools）会自己去
# dl.google.com 下载。国内这一步经常挂起，表现为构建卡在
# "Preparing Install Android SDK Build-Tools ..." 几十分钟不动，
# 而且不报错，很难判断是死了还是在慢慢下。
#
# 关掉之后：缺什么会立刻报明确错误，而不是静默挂起。
# 缺的组件用 sdkmanager 或手动装好即可。
# ─────────────────────────────────────────────────────────────
android.builder.sdkDownload=false
